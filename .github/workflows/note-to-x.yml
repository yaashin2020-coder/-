name: note → X 自動投稿

# noteに新しい記事が公開されたら、その記事をXへ投稿する。
# スマホからnoteに投稿するだけでよく、PCもClaudeのセッションも要らない。

on:
  schedule:
    # 30分おきに新着を見にいく。noteのRSS反映に数分かかるので、
    # 公開からXに出るまで最大35分ほど遅れる。
    - cron: "*/30 * * * *"
  workflow_dispatch:
    # 手動実行。試運転に使う。
    inputs:
      dry_run:
        description: "投稿せずに内容だけ確認する"
        type: boolean
        default: true

permissions:
  # 投稿済み記事の記録をリポジトリに書き戻すため
  contents: write

concurrency:
  # 同時に走ると同じ記事を二重投稿しうるので、重ならないようにする
  group: note-to-x
  cancel-in-progress: false

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 新着を確認して投稿する
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # 手動実行のときだけ dry_run を尊重する。定期実行では本番投稿。
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: |
          python3 scripts/auto_share.py \
            --user "${{ vars.NOTE_USERNAME }}" \
            --state .note-to-x-state.json

      - name: 投稿済みの記録を保存する
        run: |
          if git diff --quiet -- .note-to-x-state.json; then
            echo "記録に変更なし。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .note-to-x-state.json
          git commit -m "chore: 投稿済み記事の記録を更新"
          # 他の実行と衝突したら、こちらの記録を取り込み直してから押し込む
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash && sleep $((attempt * 5))
          done
          echo "記録の保存に失敗した。次回実行で二重投稿の恐れがあるので確認すること。" >&2
          exit 1
